[project]
name = "era5-forecast-v1"
version = "0.1.0"
description = "ERA5 forecast tasks rewarded by a clipped skill score over persistence and climatology, with WeatherBench 2 RMSE and ACC as reference metrics."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["verifiers>=0.4.0,<0.5"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["era5_forecast_v1"]
