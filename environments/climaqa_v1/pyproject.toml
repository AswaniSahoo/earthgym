[project]
name = "climaqa-v1"
version = "0.1.0"
description = "ClimaQA clean set v1: validated Gold MCQ and cloze, exact-overlap-filtered (21 near matches of Silver unresolved; a strict variant leaves them out), with exact rewards."
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "climaqa_v1/LICENSE-Apache-2.0.txt", "climaqa_v1/NOTICE"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0,<0.5"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climaqa_v1"]
