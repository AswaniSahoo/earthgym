name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run vf-validate era5-forecast-v1 --only-noop --runtime.type subprocess
      - run: >-
          uv run inspect eval src/rlenv/era5/tasks.py@era5_forecast --model mockllm/model
          --limit 3 --log-dir "$RUNNER_TEMP/inspect" --display none
      - run: uv build environments/era5_forecast_v1 --out-dir "$RUNNER_TEMP/wheels"
      - run: uv run vf-validate ibtracs-storm-v1 --only-noop --runtime.type subprocess
      - run: >-
          uv run inspect eval src/rlenv/ibtracs/tasks.py@ibtracs_storm --model mockllm/model
          --limit 3 --log-dir "$RUNNER_TEMP/inspect" --display none
      - run: uv build environments/ibtracs_storm_v1 --out-dir "$RUNNER_TEMP/wheels"
