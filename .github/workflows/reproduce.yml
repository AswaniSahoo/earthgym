name: reproduce

# Fetch each environment's pinned source data and run the tests that need it: the published
# reference numbers it reproduces and the byte-for-byte rebuild of its items (decision 0018).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  era5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      - run: uv run python -m earthgym.era5.data # the WB2 subset, about 18 MB
      - run: uv run pytest -q -rs tests/test_era5_reproduction.py tests/test_era5_items_subset.py
      - run: uv run python -m earthgym.era5.items # about 56 MB of store chunks
      - run: git diff --exit-code environments/era5_forecast_v1 reports/era5/items_v1_manifest.json

  ibtracs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      # the release asset needs the token while the repository is private
      - run: gh release download data-v1 -p ibtracs.NA.list.v04r01.csv -D data/ibtracs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run python -m earthgym.ibtracs.data # checks the sha256
      - run: uv run pytest -q -rs tests/test_ibtracs_reproduction.py tests/test_ibtracs_items_data.py

  heat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      # from NCEI, the only source. Once NCEI serves another build the items cannot be rebuilt
      # from it (decision 0018), which it did by 2026-11-02: say so, and check nothing further.
      - id: fetch
        run: |
          if ! uv run python -m earthgym.heat.data; then
            echo "::warning::NCEI no longer serves the pinned GHCN-Daily builds (decision 0018)"
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.fetch.outputs.moved != 'true'
        run: uv run pytest -q -rs tests/test_heat_reproduction.py tests/test_heat_items_data.py
