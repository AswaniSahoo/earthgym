[project]
name = "rlenv"
version = "0.1.0"
description = "Verifiable evals and RL environments for climate and earth science."
authors = [
    { name = "Aswani Kumar Sahoo", email = "aswanisahoo1012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
env = [
    "climaqa-v1",
    "era5-forecast-v1",
    "verifiers==0.4.0",
]
era5 = [
    "numcodecs==0.17.1",
    "numpy==2.5.4",
    "zarr==3.4.2",
]
eval = [
    "anthropic==2.3.0",
    "climaqa-v1",
    "era5-forecast-v1",
    "ibtracs-storm-v1",
    "inspect-ai==0.3.286",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "environments/climaqa_v1",
    "environments/era5_forecast_v1",
    "environments/ibtracs_storm_v1",
]

[tool.uv.sources]
climaqa-v1 = { workspace = true, editable = true }
era5-forecast-v1 = { workspace = true, editable = true }
ibtracs-storm-v1 = { workspace = true, editable = true }
