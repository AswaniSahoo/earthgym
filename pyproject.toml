[project]
name = "rlenv"
version = "0.1.0"
description = "Verifiable evals and RL environments for climate and earth science."
authors = [
    { name = "Aswani Kumar Sahoo", email = "aswanisahoo1012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
env = [
    "climaqa-v1",
    "verifiers==0.4.0",
]
eval = [
    "climaqa-v1",
    "google-genai==2.34.0",
    "inspect-ai==0.3.286",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "environments/climaqa_v1",
]

[tool.uv.sources]
climaqa-v1 = { workspace = true, editable = true }
